name: Release
on:
  push:
    tags:
      - '*'
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Clone Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build official package without uploading
        uses: BigWigsMods/packager@v2
        with:
          args: -d -u
      - name: Verify official package contents
        run: python3 tools/verify-package.py .release/*.zip
      - name: Publish verified release
        uses: BigWigsMods/packager@v2
        with:
          args: -u
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
